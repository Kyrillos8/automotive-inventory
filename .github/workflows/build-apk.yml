name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform folder (if missing)
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.kerolos --project-name automotive_inventory .
            rm -f test/widget_test.dart
          fi

      - name: Install packages
        run: flutter pub get

      - name: Generate database code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        run: |
          sudo apt-get update -y && sudo apt-get install -y libsqlite3-dev
          flutter test

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: automotive-inventory-apk
          path: build/app/outputs/flutter-apk/app-release.apk
